apiVersion: apps/v1
kind: Deployment
metadata: 
  name: simple-deployment
spec: 
  replicas: 3
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:   
      containers: 
        - name: nginx
          image: nginx:1.14.2
  strategy:
    type: Recreate
