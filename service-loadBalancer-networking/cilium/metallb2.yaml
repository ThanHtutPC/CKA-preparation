apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: clustermesh-pool
  namespace: metallb-system
spec:
  addresses:
  - 172.18.0.100-172.18.0.150
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: clustermesh-l2
  namespace: metallb-system
spec:
  ipAddressPools:
  - clustermesh-pool
