---
# --- 1. DATABASE TIER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        tier: database
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  selector:
    app: db
  ports:
  - port: 6379
    targetPort: 6379
---
# --- 2. BACKEND TIER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 80
---
# --- 3. FRONTEND TIER ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    tier: presentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
    spec:
      containers:
      - name: frontend
        image: curlimages/curl
        command: ["/bin/sh", "-c"]
        args:
        # Periodically hits backend (HTTP 80) and DB (TCP 6379) to generate Hubble flows
        - |
          while true; do
            echo "Requesting backend..."
            curl -s http://backend-service/ > /dev/null
            echo "Checking DB connection..."
            curl -s telnet://db-service:6379 < /dev/null
            sleep 3
          done
