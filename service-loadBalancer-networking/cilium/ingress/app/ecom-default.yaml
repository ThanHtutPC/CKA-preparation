apiVersion: apps/v1
kind: Deployment
metadata:
  name: default-backend
spec: 
  replicas: 1
  selector: 
    matchLabels:
      app: default-backend
  template:
    metadata:
      labels:
        app: default-backend
    spec: 
      containers:
        - image: nginx
          name: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: default-backend-svc
spec:
  type: ClusterIP
  selector:
    app: default-backend
  ports:
    - port: 80
      targetPort: 80

