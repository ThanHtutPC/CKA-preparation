apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-cart
spec: 
  replicas: 1
  selector: 
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec: 
      containers:
        - image: sanjeevkt720/350-ecom-cart
          name: ecom-cart
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-cart-svc
spec:
  type: ClusterIP
  selector:
    app: cart
  ports:
    - port: 3000
      targetPort: 3000

