apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: 
  name: app-policy
spec: 
  endpointSelector:
    matchLabels:
      app: db
  ingress: 
    - fromEndpoints:
        - matchLabels:
            app: backend
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
