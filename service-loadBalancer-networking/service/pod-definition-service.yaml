apiVersion: v1
kind: Service
metadata: 
  name: pod-def-svc
spec: 
  selector: 
    app.kubernetes.io/name: proxy
  ports:
  - name: name-of-service-port
    protocol: TCP
    port: 80 
    targetPort: http-web-svc
---
apiVersion: v1
kind: Pod
metadata:
  name: simple-pod
  labels:
    app.kubernetes.io/name: proxy
spec: 
  containers:
  - name: nginx
    image: nginx:latest
    ports:
    - containerPort: 80
      name: http-web-svc
