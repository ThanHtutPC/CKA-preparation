apiVersion: v1
kind: Service
metadata:
  name: without-selector
spec:
  ports:
  - port: 8080
    targetPort: nginx-port
    name: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-backend-1
  labels:
    kubernetes.io/service-name: external-backend
addressType: IPv4
ports:
- name: http
  protocol: TCP
  port: 8080
endpoints:
- addresses:
  - "10.4.5.6"
- addresses:
  - "10.1.2.3"