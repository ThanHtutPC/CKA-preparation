apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-blog
spec: 
  replicas: 1
  selector: 
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec: 
      containers:
        - image: sanjeevkt720/350-blog
          name: ecom-blog
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-blog-svc
spec:
  type: ClusterIP
  selector:
    app: blog
  ports:
    - port: 3000
      targetPort: 3000

