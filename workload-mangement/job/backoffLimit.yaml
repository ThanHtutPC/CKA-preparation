apiVersion: batch/v1
kind: Job
metadata:
  name: job-backoff-limit-per-index-example
spec:
  completions: 10
  parallelism: 3
  backoffLimit: 3
  template:
    spec:
      containers:
      - name: busybox
        image: busybox:1.36
        command: ["sh", "-c", echo 'hello k8s']
      restartPolicy: Never
  backoffLimit: 4
 
