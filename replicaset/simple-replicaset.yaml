apiVersion: apps/v1
kind: ReplicaSet
metadata: 
  name: simple-replicaset
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple
  template: 
    metadata:
      labels:
        app: simple
    spec:
      containers:
        - name:  nginx
          image:  nginx:1.14.2
          ports:
            - containerPort: 80
      resources:
        requests:
          cpu: 1
        limits: 
          cpu: 2
