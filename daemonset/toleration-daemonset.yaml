apiVersion: apps/v1
kind: DaemonSet
metadata: 
  name: simple-daemonset
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        resources:
          requests:
            cpu: 1
          limits:
            cpu: 2
        volumeMounts:
          - name: host-path 
            mountPath: /host-path
      volumes:
        - name: host-path
          hostPath: 
            path: /var/log
      tolerations:
        - effect: "NoSchedule"
          key: "node-role.kubernetes.io/control-plane"
          operator: "Equal"
