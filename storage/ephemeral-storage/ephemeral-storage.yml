apiVersion: v1
kind: Pod
metadata: 
  name: frontend
spec: 
  containers:
    - name: nginx
      image: nginx
      resources:
        requests:
          ephemeral-storage: "2Gi"
        limits:
          ephemeral-storage: "4Gi"
      volumeMounts:
        - name: ephemeral
          mountPath: "/var/www/html"
  volumes:
    - name: ephemeral
      emptyDir: 
        sizeLimit: 500Mi
