apiVersion: v1
kind: Pod
metadata: 
  name: hostpath-example
spec:
  containers: 
    - name: nginx
      image: nginx
      volumeMounts:
        - mountPath: /foo
          name: example-volume
          readOnly: true
  volumes:
    - name: example-volume
      hostPath: 
        path: /data/foo
        type: DirectoryOrCreate