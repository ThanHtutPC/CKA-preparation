apiVersion: v1
kind: Pod
metadata:
  name: sa-token-test
spec:
  serviceAccountName: default
  containers:
  - name: my-container
    image: busybox:1.28
    command: ["sleep", "3600"]
    volumeMounts:
    - name: token-vol
      mountPath: "/service-account"
      readOnly: true
  volumes:
  - name: token-vol
    projected:
      sources:
      - serviceAccountToken:
          audience: api
          expirationSeconds: 3600
          path: token # Creates a file at /service-account/token