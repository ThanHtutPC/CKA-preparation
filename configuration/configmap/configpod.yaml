apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo-pod
spec:
  containers:
    - name: demo
      image: alpine
      command: ["sleep", ""]
apiVersion: v1
kind: Pod
metadata:
  name: configmap-pod-demo
spec:
  containers:
    - name: demo
      image: alpine
      command: ['sleep', '3600']
      env:
        - name: PLAYER_INITIAL_LIVES
          value: "3"
        - name: UI_PROPERTIES_FILE_NAMES
          valueFrom:
            configMapKeyRef:
              name: game-demo
              key: ui_properties_file_name
      volumeMounts:
        - name: configtest
          mountPath: "/config"
          readOnly: true
  volumes:
    - name: configtest
      configMap:
        name: game-demo
        items:
          - key: "game.properties"
            path: "game.properties"
          - key: "ui_properties_file_name"
            path: "ui_properties_file_name"
