apiVersion: v1
kind: ConfigMap
metadata:
  name: game-demo
immutable: true
data:
  player_initial_lives: '3'
  ui_properties_file_name: 'user-interface.properties'
  game.properties: | 
    enemy.types=alians,monsters
    player.maximum-lives=5
  user-interface.properties: | 
    color.good=purple
    color.bad=yellow
    allow.textmode=true
  APP_COLOR: blue 
  APP_MODE: production
