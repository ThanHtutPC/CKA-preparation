apiVersion: v1
kind: Pod
metadata: 
  name: secret-env-pod
spec:
  containers:
    - name: app
      image: busybox
      command: ['sh', '-c','echo Username: $USERNAME; echo Password: $PASSWORD; sleep 3600' ]
      env:
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: yaml-secret
              key: username
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: yaml-secret
              key: password
