apiVersion: v1
kind: Pod
metadata:
  name: node-affinity-pod
  labels:
    app: backend 
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
  affinity:
    nodeAffinity: 
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In 
            values: 
            - pipeline-cluster-worker2
  
