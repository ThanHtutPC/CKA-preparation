services:
  # Main web application
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://api:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # API application - using Python HTTP server
  api:
    image: python:3.9-alpine
    command: ["python", "-m", "http.server", "3000"]
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  # Init container - database migration
  db-migrate:
    image: busybox
    command: ["sh", "-c", "echo '✅ Database migration completed successfully'; sleep 3"]
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Init container - initial setup
  db-init:
    image: busybox
    command: ["sh", "-c", "echo '🔧 Running initial setup...'; sleep 2; echo '✅ Setup completed'"]

  # Sidecar container - monitoring
  sidecar:
    image: busybox
    command: ["sh", "-c", "echo '🔄 Sidecar started - monitoring...'; sleep 3600"]
    depends_on:
      - web

  # Ephemeral container - one-time job
  temp-job:
    image: busybox
    command: ["sh", "-c", "echo '⚡ Running one-time job...'; sleep 2; echo '✅ Job completed'"]
    restart: "no"
    depends_on:
      - web