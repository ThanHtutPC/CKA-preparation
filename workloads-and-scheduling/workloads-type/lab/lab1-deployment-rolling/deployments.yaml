apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    tier: frontend
  namespace: web-app
spec:
  replicas: 4
  selector:
    matchLabels:
      tier: frontend
  template:
    metadata:
      labels:
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.24
          ports:
            - containerPort: 80
