apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello
spec:
  schedule: "*/5 * * * *"
  jobTemplate: 
    spec: 
      template: 
        spec: 
          containers:
          - name: hello
            image: busybox 
            imagePullPolicy: IfNotPresent 
            command:
              - /bin/sh 
              - -c
              - echo "backup complete"
          restartPolicy: OnFailure 
