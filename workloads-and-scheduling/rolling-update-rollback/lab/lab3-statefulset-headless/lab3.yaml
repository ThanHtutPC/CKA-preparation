apiVersion: v1
kind: Service
metadata:
  name: web-headless
  labels:
    app: nginx 
spec:
  ports:
  - port: 80
    targetPort: 80
    name: web
  type: ClusterIP
  selector:
    app: nginx
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx-state
spec:
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate 
  selector:
    matchLabels:
      app: nginx 
  serviceName: "web-headless"
  replicas: 3 
  minReadySeconds: 10 
  template:
    metadata:
      labels:
        app: nginx 
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi

