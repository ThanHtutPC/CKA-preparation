apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemonset-deploy
  namespace: kube-system
  labels:
    k8s-app: web-deploy
spec:
  selector:
    matchLabels:
      name: web
  template:
    metadata:
      labels:
        name: web
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: monitoring
                operator: In
                values:
                - 'true'
      containers:
      - name: nginx
        image: busybox
        command: ['sh', '-c', 'sleep infinity']
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 200Mi
        volumeMounts:
        - name: varlog
          mountPath: /var/log
      terminationGracePeriodSeconds: 30
      volumes:
      - name: varlog
        hostPath:
          path: /var/log

