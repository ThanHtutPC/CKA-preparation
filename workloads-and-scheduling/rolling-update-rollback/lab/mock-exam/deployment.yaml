apiVersion: v1
kind: Service
metadata:
  name: deploy-svc 
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: web
spec: 
  strategy:
    type: RollingUpdate
    rollingUpdate: 
      maxUnavailable: 0 
      maxSurge: 1
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels: 
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports: 
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
