apiVersion: apps/v1
kind: Deployment 
metadata:
  name: web-deploy
  labels:
    app: web-deploy
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate 
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.14.2
        ports:
        - containerPort: 80
        startupProbe: 
          httpGet: 
            path: /
            port: 80 
          periodSeconds: 5
          failureThreshold: 30 
        #readinessProbe:
        #  httpGet: { path: / , port: 80 }
        #  initialDelaySeconds: 2
        #  periodSeconds: 3
        #livenessProbe: 
        #  httpGet: 
        #    path: /
        #    port: 80
        #  periodSeconds: 3
        #  initialDelaySeconds: 3
        resources:
          requests:
            cpu: 50m
            memory: 200Mi
          limits:
            cpu: 100m 
            memory: 300Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: web 
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 80
