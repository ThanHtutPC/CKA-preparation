apiVersion: v1  
kind: ConfigMap
metadata:
  name: env-configmap
data: 
  env: prod
  log: debug
  user-interface.properties: |
    color.good=purple
    color.bad=yellow
    allow.textmode=true
---
apiVersion: v1 
kind: Pod
metadata: 
  name: env-pod
spec:
  volumes: 
    - name: config 
      configMap:
        name: env-configmap
        items:
          - key: "user-interface.properties"
            path: "user-interface"
  containers:
    - name: busybox 
      image: busybox:1.38
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: LOG_MODE
          valueFrom:
            configMapKeyRef: 
              name: env-configmap
              key: log 
      volumeMounts:
        - name: config
          mountPath: "/config"
          readOnly: true 
