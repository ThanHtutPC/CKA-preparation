apiVersion: v1 
kind: ConfigMap
metadata: 
  name: app-config
data:
  LOG_LEVEL: debug
  APP_MODE: sleep
---
apiVersion: v1 
kind: Pod
metadata:
  name: config-envfrom
spec: 
  containers: 
    - name: demo-container
      image: busybox:1.38 
      command: ["sh", "-c", "echo \"LOG_LEVEL: $LOG_LEVEL, APP_MODE: $APP_MODE\"; sleep 3600"]
      envFrom:
        - configMapRef:
            name: app-config
      restartPolicy: Never
